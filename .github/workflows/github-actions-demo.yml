name: Create Unity Package
run-name: ${{ github.actor }} is testing out GitHub Actions 🚀
on: [push]
jobs:
  echo:
    runs-on: ubuntu-latest
    steps:
    - name: Harden the runner (Audit all outbound calls)
      uses: step-security/harden-runner@f4a75cfd619ee5ce8d5b864b0d183aff3c69b55a # v2.13.1
      with:
        egress-policy: audit

    - uses: actions/checkout@ee0669bd1cc54295c223e0bb666b733df41de1c5 # v2.7.0
    - run: |
        echo "Assets/RudderStack.meta" > metaList
        find Assets/RudderStack/ -name \*.meta >> metaList

    - run: mkdir a

    - uses: pCYSl5EDgo/create-unitypackage@77c5dcf43a204347b6ee3cac788817e70f1b7e56 # v1
      with:
        package-path: '/tmp/output.unitypackage'
        include-files: metaList
    - run: cp /tmp/output.unitypackage a/output.unitypackage
    - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
      with:
        path: a
        name: package

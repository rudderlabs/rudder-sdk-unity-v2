name: Offline startup tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3.6.0
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '8.0.x'
      - name: Check runtime sources against .NET Standard 2.1
        run: dotnet build tests/OfflineStartup/OfflineStartup.csproj --configuration Release -p:UnityApiCompatibility=true
      - name: Test SDK startup and recovery
        run: dotnet test tests/OfflineStartup/OfflineStartup.csproj --configuration Release --logger trx --results-directory TestResults

name: Build UnityPackage
on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-unitypackage:
    name: Build UnityPackage
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@f4a75cfd619ee5ce8d5b864b0d183aff3c69b55a # v2.13.1
        with:
          egress-policy: audit

      - name: Checkout Repository
        uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3.6.0

      - name: Test package export and verify SDK contents
        run: python3 -m unittest discover -s tests/PackageExport -v

      - name: Build UnityPackage
        run: python3 scripts/export_unitypackage.py

      - name: Upload UnityPackage
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: RudderStackUnityPackage
          path: |
            artifacts/RudderStackUnity.unitypackage
            artifacts/RudderStackUnity.unitypackage.sha256
          if-no-files-found: error
